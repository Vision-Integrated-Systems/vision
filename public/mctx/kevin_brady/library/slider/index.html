<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Library Kiosk</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 1080px;
    height: 1920px;
    background: #0b2545;
    color: #fff;
    font-family: "Segoe UI", Arial, sans-serif;
    overflow: hidden;
  }

  /* ---------- STAGE ---------- */
  #stage {
    position: absolute;
    top: 0;
    left: 0;
    width: 1080px;
    height: 1920px;
    background: #0b2545;
    overflow: hidden;
  }

  .slide {
    position: absolute;
    top: 0;
    left: 0;
    width: 1080px;
    height: 1920px;
    opacity: 0;
    transition: opacity 0.4s ease-in-out;
    object-fit: contain;
    background: #0b2545;
  }
  .slide.active {
    opacity: 1;
  }

  video.slide {
    background: #000;
  }

  /* ---------- FOOTER STRIP ---------- */
  #footer {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 1080px;
    height: 8px;
    background: linear-gradient(90deg, #ff7a00, #ffd56b, #ff7a00);
    z-index: 11;
  }
</style>
</head>
<body>

  <div id="stage"></div>
  <div id="footer"></div>

<script>
/* ============================================================
   CONFIG
   ============================================================ */

// List the video files (in the video folder).
var VIDEOS = [
  "video/Adult - Crafting Corner.mp4",
  "video/Adult - Culinary Book Club.mp4",
  "video/Adult - Fiction Book Club.mp4",
  "video/Adult - Home and Garden.mp4",
  "video/Adult - Mahjong.mp4",
  "video/Adult - Walking Book Club.mp4",
  "video/All Ages - Family Fun Zone.mp4",
  "video/All Ages - Family Game Night.mp4",
  "video/General - Facebook.mp4",
  "video/General - Flipster.mp4",
  "video/General - Get a Library Card.mp4",
  "video/General - Libby.mp4",
  "video/General - MCMLS App.mp4",
  "video/General - Transparent Language.mp4",
  "video/Kids - LEGO with Lexi.mp4",
  "video/Kids - READ to the Dogs.mp4",
  "video/Kids - STEAM Crafternoon.mp4",
  "video/Kids - Storytime.mp4",
  "video/SR 2026 - Events.mp4",
  "video/SR 2026 - Promo Graphic.mp4",
  "video/SR 2026 - Reader Zone.mp4",
  "video/SR 2026 - Win Prizes.mp4",
  "video/Teen - Bullet Journaling.mp4",
  "video/Teen - Manga Meetup.mp4",
  "video/Teen - Planet Yum.mp4"
];

/* ============================================================
   SLIDESHOW
   ============================================================ */

var stage = document.getElementById("stage");
var videoIndex = 0;
var safetyTimer = null;

// Single, reused video element — no per-slide allocation, only one decoder ever active.
var vid = document.createElement("video");
vid.className = "slide";
vid.muted = true;
vid.playsInline = true;
vid.controls = false;
vid.preload = "none";
stage.appendChild(vid);

function playNext() {
  if (safetyTimer) { clearTimeout(safetyTimer); safetyTimer = null; }

  var src = VIDEOS[videoIndex];
  videoIndex = (videoIndex + 1) % VIDEOS.length;

  // Tear down the previous clip before loading a new one.
  vid.classList.remove("active");
  try { vid.pause(); } catch (e) {}
  vid.removeAttribute("src");
  vid.load();

  vid.src = src;
  vid.load();
  var p = vid.play();
  if (p && p.catch) p.catch(function () { advance(); });

  // force reflow so the opacity transition triggers
  void vid.offsetWidth;
  vid.classList.add("active");

  // safety net: never let a stuck video freeze the kiosk
  safetyTimer = setTimeout(advance, 5 * 60 * 1000);
}

var advancing = false;
function advance() {
  if (advancing) return;
  advancing = true;
  setTimeout(function () { advancing = false; playNext(); }, 50);
}

vid.onended = advance;
vid.onerror = function () { setTimeout(advance, 100); };

// Kick off
playNext();
</script>
</body>
</html>
